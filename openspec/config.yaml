schema: spec-driven

context: |
  Project: Cryptofolio — personal crypto portfolio tracker (single-user).
  State: implemented through US-018. Backend, frontend, DB schema, on-chain + Binance sync,
  position engine are all real code.
  Stack: Fastify 5 + Zod 4 + pg + decimal.js + viem (backend), React 19 + react-router-dom v7
  + Tailwind v4 + Vite 6 (frontend), PostgreSQL via node-pg-migrate (DB).
  Auth: JWT HS256 + bcrypt via @fastify/cookie + @fastify/jwt.
  Accounting: WAC puro, per-position cycles, swap decomposition, WAC inheritance on TRANSFER_IN.
  Language: Spanish-leaning with English technical terms.

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
    - Reference the originating US-XXX from prd.json when applicable
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Preserve PRD invariants verbatim (WAC puro, cycle lifecycle, UNIQUE constraints)
  design:
    - Include sequence diagrams for sync flows (on-chain + Binance)
    - Document architecture decisions with rationale, not just outcome
    - Call out idempotency strategy for any sync endpoint
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, ...)
    - Each task small enough for one session
    - NEGATIVE criteria from PRD acceptance lists become explicit test tasks
  apply:
    - Follow existing code patterns once established
    - Load relevant coding skills (typescript, zod-4, nodejs-backend-patterns, react-19, tailwind-4)
    - Strict TDD: write failing test, make it pass, refactor
  verify:
    - Compare implementation against every spec scenario AND every PRD acceptance criterion
    - Flag any drift from PRD invariants as CRITICAL
  archive:
    - Warn before merging destructive deltas (large removals)
    - Update prd.json version field if accounting semantics changed

testing:
  strict_tdd_mode: false
  detected_at: 2026-05-10
  test_runner:
    framework: none
    status: not_found
  layers:
    unit:
      available: false
      tool: —
    integration:
      available: false
      tool: —
    e2e:
      available: false
      tool: —
  coverage:
    available: false
  quality:
    linter:
      available: true
      command: "npm run lint"
      tool: eslint 9 flat
    type_checker:
      available: true
      command: "npm run typecheck"
      tool: tsc --noEmit
    formatter:
      available: true
      command: "npm run format:check"
      tool: prettier 3

prd_source_of_truth: prd.json
